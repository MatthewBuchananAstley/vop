name: Build Windows CLI Binaries (Python)

on:
  push:
    tags:
      - 'windows-v*.*.*' # Trigger on new tags like v1.0.0, v1.0.0-beta, etc.
      
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-windows-binaries-python:
    runs-on: windows-latest # Uses the latest Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can adjust the Python version as needed

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build vop.py
        # Build vop.py into a single executable
        # The output will be in ./dist/vop.exe
        run: pyinstaller --onefile --name vop vop.py
        # IMPORTANT: Ensure vop.py exists at the root of your repository.
        # Adjust 'vop.py' if your script has a different name.

      - name: Build t3.py
        # Build t3.py into a single executable
        # The output will be in ./dist/t3.exe
        run: pyinstaller --onefile --name t3 t3.py
        # IMPORTANT: Ensure t3.py exists at the root of your repository.
        # Adjust 't3.py' if your script has a different name.

      - name: Build Password_entropy_verifier.py
        # Build Password_entropy_verifier.py into a single executable
        # The output will be in ./dist/Password_entropy_verifier.exe
        run: pyinstaller --onefile --name Password_entropy_verifier Password_entropy_verifier.py
        # IMPORTANT: Ensure Password_entropy_verifier.py exists at the root of your repository.
        # Adjust 'Password_entropy_verifier.py' if your script has a different name.

      - name: Upload Windows Binaries artifact
        # This step is for general artifact storage, useful for debugging or non-release builds
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-binaries-python
          path: |
            ./dist/vop.exe
            ./dist/t3.exe
            ./dist/Password_entropy_verifier.exe
          retention-days: 7

      - name: Create GitHub Release and Upload Assets
        # This step runs only when a tag is pushed (e.g., v1.0.0)
        # It creates a new GitHub Release and attaches the compiled executables to it.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vop.exe
            dist/t3.exe
            dist/Password_entropy_verifier.exe
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
