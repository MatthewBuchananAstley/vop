name: Build Windows CLI Binaries (Python)

on:
  push:
    tags:
      - 'windows-v*.*.*' # Trigger on new tags like v1.0.0, v1.0.0-beta, etc.
      
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-executables:
    runs-on: windows-latest # Use a Windows runner

    permissions:
      contents: write # Nodig voor checkout en upload-artifact
      #packages: write # Optioneel, als je naar GitHub Packages zou publiceren

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # Gebruik de nieuwste Python 3-versie

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Create 'executables' directory
      run: mkdir -p executables

    # --- Bouw en Verplaats Executables ---
    - name: Build Password_entropy_verifier.py executable
      run: pyinstaller --onefile Password_entropy_verifier.py
      working-directory: ${{ github.workspace }}
      # Na het bouwen verplaatsen we het direct naar de executables map
    - name: Move Password_entropy_verifier.exe
      run: Move-Item dist\Password_entropy_verifier.exe executables\Password_entropy_verifier.exe
      shell: pwsh

    - name: Build vop executable
      run: pyinstaller --onefile vop # Aanname: 'vop' is het Python script zonder .py extensie
      working-directory: ${{ github.workspace }}
    - name: Move vop.exe
      run: Move-Item dist\vop.exe executables\vop.exe
      shell: pwsh

    - name: Build t3 executable
      run: pyinstaller --onefile t3 # Aanname: 't3' is het Python script zonder .py extensie
      working-directory: ${{ github.workspace }}
    - name: Move t3.exe
      run: Move-Item dist\t3.exe executables\t3.exe
      shell: pwsh

    - name: Ensure GPG is available
      run: |
        if (-not (Get-Command gpg -ErrorAction SilentlyContinue)) {
          choco install gnupg
        } else {
          Write-Host "GPG is already installed."
        }
      shell: pwsh
      
    # --- Configureer en Signeer GPG ---
    - name: Configure GPG for signing
      run: |
        Write-Host "Start GPG configuratie."

        # Decode base64 secret to byte array using PowerShell's .NET methods
        $privateKeyBytes = [System.Convert]::FromBase64String("${{ secrets.GPG_PRIVATE_KEY }}")

        # Write byte array to a temporary file
        $tempKeyFile = "private_key_temp.asc"
        [System.IO.File]::WriteAllBytes($tempKeyFile, $privateKeyBytes)
        Write-Host "Tijdelijk private sleutelbestand '$tempKeyFile' aangemaakt."

        # Import the GPG key from the temporary file
        # Use --pinentry-mode loopback to ensure non-interactive import
        gpg --batch --import --pinentry-mode loopback $tempKeyFile
        Write-Host "GPG private sleutel import poging voltooid."

        # Clean up the temporary key file immediately after import for security
        Remove-Item $tempKeyFile
        Write-Host "Tijdelijk private sleutelbestand verwijderd."

        # Check if the key was successfully imported
        Write-Host "Controleer geïmporteerde geheime sleutels..."
        gpg --list-secret-keys --keyid-format LONG
        Write-Host "Einde controle geheime sleutels."

        # Save the passphrase to a temporary file and set restrictive permissions
        echo "${{ secrets.GPG_PASSPHRASE }}" > gpg_passphrase.txt
        icacls gpg_passphrase.txt /inheritance:d
        icacls gpg_passphrase.txt /grant:r "$($env:USERNAME):(R)"
        icacls gpg_passphrase.txt /deny "Everyone:(R,W,D)"
        Write-Host "Passphrase-bestand permissies ingesteld."
      shell: pwsh

    - name: Sign all executables
      env:
        GPG_TTY: $(pwd)/gpg_passphrase.txt
        GPG_KEYID: "5E3097F9AF5D0E9B1DB0641FB958339F1229A6EE"
        GPG_EMAIL: "ci@astley.nl"
        GPG_FULLNAME: "CI Release Bot (Automated Release Signing Key)"
      run: |
        cd executables
        $executables = Get-ChildItem *.exe
        foreach ($exe in $executables) {
            Write-Host "Handtekening genereren voor $($exe.Name)..."
            gpg --batch --yes --pinentry-mode loopback --passphrase-file ../gpg_passphrase.txt --default-key "${{ env.GPG_KEYID }}" --detach-sign --armor $($exe.Name)
            if (-not (Test-Path "$($exe.Name).asc")) {
                throw "GPG handtekeningbestand voor $($exe.Name) is niet aangemaakt!"
            }
            Write-Host "$($exe.Name) succesvol ondertekend."
        }
      shell: pwsh

    - name: Clean up PyInstaller build files
      run: |
        Remove-Item -Recurse -Force dist/ build/
        Remove-Item gpg_passphrase.txt
      shell: pwsh

    - name: Upload Windows Executables and Signatures
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables-and-signatures
        path: executables/ # Upload de hele map met alle .exe en .asc bestanden
        retention-days: 7 # Hoe lang de artifacts bewaard moeten blijven
