on:
  push:
    tags:
      - 'v*' # Trigger on new tags like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

name: Create RPM Release # Workflow name

jobs:
  build:
    name: Create RPM Release
    runs-on: ubuntu-latest
    permissions: # <--- ADD THIS SECTION!
      contents: write # Grants permission to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use v4 for actions/checkout

      # Optional: Add a debug step to list files if you still have path issues
      # - name: List files for debugging
      #   run: ls -al /github/workspace/
      # --- NEW STEP TO CREATE THE SOURCE TARBALL ---
      - name: Create Source Tarball
        run: |
         - name: Create Source Tarball
        run: |
          # The directory that contains your repository's content
          # After actions/checkout, your repo is in /home/runner/work/YOUR_REPO_NAME/YOUR_REPO_NAME
          # We want to tar up the second YOUR_REPO_NAME directory.

          # Get the repository name (e.g., 'vop' from 'MatthewBuchananAstley/vop')
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          # Get the tag name without 'refs/tags/' prefix (e.g., 'v1.0.0')
          TAG_NAME="${{ github.ref_name }}"

          # Define the desired tarball filename
          TARBALL_NAME="${REPO_NAME}-${TAG_NAME}.tar.gz"

          # Define the source directory to tar (the actual root of your checked out repo)
          # This is typically the GITHUB_WORKSPACE environment variable
          SOURCE_DIR="${{ github.workspace }}"

          # Navigate to the parent directory to safely create the tarball
          # We assume the current directory when this step starts is /github/workspace
          # So we'll create the tarball IN /github/workspace for easy access later,
          # but we'll tar the contents of the *cloned repository*, not the workspace itself.

          # IMPORTANT: Check if the cloned repository root is indeed /github/workspace
          # actions/checkout@v4 places the repo content directly in /github/workspace
          # So, we'll tar the *contents* of /github/workspace into a new tarball
          # but we need to ensure the tarball itself isn't included in the archive.

          # Let's adjust the tar command slightly.
          # We still want the tarball created in /github/workspace
          # but we'll tell tar to operate on a copy or a specific set of files.

          # A safer way to create the tarball from the workspace content:
          # Use -C to change directory *before* processing, but keep output in $PWD
          # This ensures tar is not trying to archive the output file itself
          # if the output location is within the source tree it's archiving.
          tar -czf "$TARBALL_NAME" --exclude='.git' --exclude='.github' --exclude='node_modules' -C "$SOURCE_DIR" .

          echo "Generated tarball: $TARBALL_NAME"
          # Store the tarball path. Since it's created in $PWD, which is /github/workspace,
          # its path will be /github/workspace/TARBALL_NAME
          echo "TARBALL_PATH=$SOURCE_DIR/$TARBALL_NAME" >> $GITHUB_OUTPUT
        
        id: create_tarball # Assign an ID to this step to reference its output
        
      - name: Build RPM package
        id: rpm_build # ID to reference its outputs
        uses: naveenrajm7/rpmbuild@master # Check this action's outputs and stability
        with:
          spec_file: "vop.spec" # Assumes vop.spec is in the repository root

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2 # Standard action for releases and asset uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }} # The full ref (e.g., refs/tags/v1.0.0)
          name: Release ${{ github.ref_name }} # Just the tag name (e.g., v1.0.0)
          body: |
            Changes in this Release
            - Create RPM
            - Upload Source RPM
            - Source tarball included.
          draft: false
          prerelease: false
          files: |
            ${{ steps.rpm_build.outputs.source_rpm_path }} # Path to the generated SRPM
            ${{ steps.rpm_build.outputs.rpm_path }}
            ${{ steps.create_tarball.outputs.TARBALL_PATH }} # <--- ADDED THIS LINE!
