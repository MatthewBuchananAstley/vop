on:
  push:
    tags:
      - 'v*' # Trigger on new tags like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

name: Create RPM Release # Workflow name

jobs:
  build:
    name: Create RPM Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step to Create the Source Tarball ---
      - name: Create Source Tarball
        id: create_tarball # Assign an ID to this step to reference its output
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TAG_NAME="${{ github.ref_name }}"
          TARBALL_NAME="${REPO_NAME}-${TAG_NAME}.tar.gz"
          # De GITHUB_WORKSPACE variabele is de correcte root directory
          # Op de runner is dit '/home/runner/work/vop/vop' zoals we hebben vastgesteld

          TEMP_TARBALL_PATH="/tmp/$TARBALL_NAME"

          # Archive the contents of the repository root
          # Gebruik direct ${{ github.workspace }}
          tar -czf "$TEMP_TARBALL_PATH" --exclude='.git' --exclude='.github' --exclude='node_modules' -C "${{ github.workspace }}" .

          # Move the created tarball to the workspace for the next step to find it
          mv "$TEMP_TARBALL_PATH" "${{ github.workspace }}/$TARBALL_NAME"

          echo "Generated tarball: $TARBALL_NAME"
          echo "TARBALL_PATH=${{ github.workspace }}/$TARBALL_NAME" >> $GITHUB_OUTPUT

      # --- Step to Build RPM package ---
      - name: Build RPM package
        id: rpm_build # ID to reference its outputs
        uses: naveenrajm7/rpmbuild@master
        with:
          spec_file: "vop.spec"

      # --- NIEUWE STAP: Set up GPG and Sign Release Assets ---
      - name: Set up GPG and Sign Release Assets
        id: sign_assets # Geef deze stap een ID om de outputs te kunnen refereren
        run: |
          echo "--- Installeren en Instellen van GPG ---"
          # Installeer GPG als het nog niet aanwezig is (vaak al op ubuntu-latest)
          sudo apt-get update && sudo apt-get install -y gnupg

          # Importeren van de private GPG sleutel vanuit secret
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

          # Maak een file met de passphrase aan voor GPG
          # De passphrase file wordt na gebruik weer verwijderd
          echo "${{ secrets.GPG_PASSPHRASE }}" > passphrase.txt

          echo "--- Signeren van Assets ---"
          # Dynamisch vinden en signeren van de Source RPM
          # De output van find is het volledige pad inclusief de bestandsnaam
          ACTUAL_SOURCE_RPM=$(find /home/runner/rpmbuild/SRPMS/ -name "*.src.rpm" -print -quit)
          if [ -f "$ACTUAL_SOURCE_RPM" ]; then
            echo "Signeren van: $ACTUAL_SOURCE_RPM"
            gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${ACTUAL_SOURCE_RPM}.sig" "$ACTUAL_SOURCE_RPM"
            echo "SIGNED_SOURCE_RPM_SIG=${ACTUAL_SOURCE_RPM}.sig" >> $GITHUB_OUTPUT
          else
            echo "Waarschuwing: Geen Source RPM gevonden om te signeren in /home/runner/rpmbuild/SRPMS/."
          fi

          # Dynamisch vinden en signeren van de Binary RPM (noarch)
          ACTUAL_BINARY_RPM=$(find /home/runner/rpmbuild/RPMS/noarch/ -name "*.noarch.rpm" -print -quit)
          if [ -f "$ACTUAL_BINARY_RPM" ]; then
            echo "Signeren van: $ACTUAL_BINARY_RPM"
            gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${ACTUAL_BINARY_RPM}.sig" "$ACTUAL_BINARY_RPM"
            echo "SIGNED_BINARY_RPM_SIG=${ACTUAL_BINARY_RPM}.sig" >> $GITHUB_OUTPUT
          else
            echo "Waarschuwing: Geen Binary RPM gevonden om te signeren in /home/runner/rpmbuild/RPMS/noarch/."
          fi

          # Signeren van de Tarball
          TARBALL_PATH="${{ steps.create_tarball.outputs.TARBALL_PATH }}"
          if [ -f "$TARBALL_PATH" ]; then
            echo "Signeren van: $TARBALL_PATH"
            gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${TARBALL_PATH}.sig" "$TARBALL_PATH"
            echo "SIGNED_TARBALL_SIG=${TARBALL_PATH}.sig" >> $GITHUB_OUTPUT
          else
            echo "Waarschuwing: Geen Tarball gevonden om te signeren."
          fi

          # Verwijder de passphrase file voor de zekerheid
          rm passphrase.txt
        shell: bash

      # --- Debugging step to confirm file paths ---
      - name: Debug Generated Files and Paths
        if: always() # Run even if previous steps fail, for debugging
        run: |
          echo "--- Current Working Directory ---"
          pwd
          echo "--- Contents of ${{ github.workspace }} (Checkout Dir) ---"
          ls -al ${{ github.workspace }}/ # Corrected: uses the actual workspace path
          echo "--- Contents of /home/runner/rpmbuild/ (RPM Base Dir) ---"
          #ls -al /home/runner/rpmbuild/ # Directly specify known base path
          echo "--- Contents of /home/runner/rpmbuild/RPMS/ ---"
          #ls -al /home/runner/rpmbuild/RPMS/
          echo "--- Contents of /home/runner/rpmbuild/RPMS/noarch/ ---"
          #ls -al /home/runner/rpmbuild/RPMS/noarch/
          echo "--- Contents of /home/runner/rpmbuild/SRPMS/ ---"
          #ls -al /home/runner/rpmbuild/SRPMS/
          echo "--- Contents of Signed Assets directory (if applicable) ---"
          # Controleer of de .sig bestanden bestaan naast de originele assets
          #ls -al /home/runner/rpmbuild/SRPMS/*.sig 2>/dev/null || echo "No .sig for Source RPM found"
          #ls -al /home/runner/rpmbuild/RPMS/noarch/*.sig 2>/dev/null || echo "No .sig for Binary RPM found"
          #ls -al ${{ steps.create_tarball.outputs.TARBALL_PATH }}.sig 2>/dev/null || echo "No .sig for Tarball found"


          echo "--- Verifying Output Variables ---"
          echo "Source RPM Path (from action): ${{ steps.rpm_build.outputs.source_rpm_path }}"
          echo "Binary RPM Dir Path (from action): ${{ steps.rpm_build.outputs.rpm_dir_path }}"
          echo "Tarball Path (from create_tarball step): ${{ steps.create_tarball.outputs.TARBALL_PATH }}"
          echo "Expected Source RPM SIG Path (from sign_assets step): ${{ steps.sign_assets.outputs.SIGNED_SOURCE_RPM_SIG }}"
          echo "Expected Binary RPM SIG Path (from sign_assets step): ${{ steps.sign_assets.outputs.SIGNED_BINARY_RPM_SIG }}"
          echo "Expected Tarball SIG Path (from sign_assets step): ${{ steps.sign_assets.outputs.SIGNED_TARBALL_SIG }}"
          echo "Expected Binary RPM Upload Pattern: /home/runner/rpmbuild/RPMS//noarch/*.rpm"
        shell: bash

      # --- Step to Create GitHub Release and Upload Assets ---
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            This is an automated release.
            Details:
            - Source RPM generated and signed.
            - Binary RPM generated and signed.
            - Source tarball included and signed.
          draft: false
          prerelease: false
          files: | # <--- BIJGEWERKTE FILES SECTIE INCL. SIGNATUREN
            /home/runner/rpmbuild/SRPMS/*.src.rpm           # Source RPM
            /home/runner/rpmbuild/RPMS/noarch/*.rpm         # Binary RPM
            ${{ steps.create_tarball.outputs.TARBALL_PATH }} # Source Tarball
            ${{ steps.sign_assets.outputs.SIGNED_SOURCE_RPM_SIG }} # Handtekening Source RPM
            ${{ steps.sign_assets.outputs.SIGNED_BINARY_RPM_SIG }} # Handtekening Binary RPM
            ${{ steps.sign_assets.outputs.SIGNED_TARBALL_SIG }}   # Handtekening Source Tarball
