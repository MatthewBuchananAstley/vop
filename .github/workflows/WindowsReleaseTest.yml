name: Verify and Test Windows Release Executables

on:
  release: # Deze workflow triggert automatisch wanneer een nieuwe GitHub Release wordt gepubliceerd
    types: [published]
  workflow_dispatch: # Optie om handmatig te triggeren
    inputs: # Voeg deze 'inputs' sectie toe
      release_tag: # De naam van de input
        description: windows-v1.4.0 #'De tag van de release om te verifiëren (bijv. windows-v1.4.0)'
        required: true # De gebruiker moet een waarde opgeven
        default: 'windows-v1.4.0'
  

jobs:
  verify-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository # Nodig om de GPG verificatie instructies/sleutel te kunnen benaderen, of andere test scripts
      uses: actions/checkout@v4

    - name: Download Release Assets # Stap 1: Download de bestanden van de zojuist gepubliceerde release
      run: |
        $releaseAssets = "${{ toJson(github.event.release.assets) }}" | ConvertFrom-Json

        # Lijst van bestanden die we verwachten te downloaden
        $expectedFiles = @(
            "Password_entropy_verifier.exe",
            "Password_entropy_verifier.exe.asc",
            "vop.exe",
            "vop.exe.asc",
            "t3.exe",
            "t3.exe.asc"
        )

        # Base URL voor het downloaden van assets (vereist authenticatie voor private repos)
        $downloadHeaders = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/octet-stream"
        }

        Write-Host "Downloading assets from release tag: ${{ github.event.release.tag_name }}"
        foreach ($asset in $releaseAssets) {
            if ($expectedFiles -contains $asset.name) {
                Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)..."
                try {
                    Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $asset.name -UseBasicParsing -ErrorAction Stop
                    Write-Host "$($asset.name) downloaded successfully."
                } catch {
                    throw "Failed to download $($asset.name): $($_.Exception.Message)"
                }
            } else {
                Write-Host "Skipping unexpected asset: $($asset.name)"
            }
        }

        # Controleer of alle verwachte bestanden zijn gedownload
        foreach ($file in $expectedFiles) {
            if (-not (Test-Path $file)) {
                throw "Error: Expected file '$file' was not downloaded."
            }
        }
        Write-Host "All expected assets downloaded."
      shell: pwsh

    - name: Configure GPG for Verification # Stap 2: Configureer GPG voor verificatie
      run: |
        Write-Host "Start GPG configuratie voor verificatie."
        $publicKeyId = "5E3097F9AF5D0E9B1DB0641FB958339F1229A6EE" # Uw publieke sleutel ID

        # Probeer publieke sleutel op te halen van een keyserver
        Write-Host "Poging om publieke GPG sleutel te importeren (ID: $publicKeyId)..."
        try {
            gpg --keyserver hkps://keys.openpgp.org --recv-keys $publicKeyId
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Waarschuwing: Keyserver import mislukt, probeer alternatieve import."
                # Als keyserver niet werkt, importeert u de sleutel handmatig (pas dit aan als uw sleutel verandert)
                # $publicKeyContent = "Public-key block" 
                $publicKeyContent | Out-File -FilePath "release_public_key.asc" -Encoding ascii
                gpg --import "release_public_key.asc"
            }
        } catch {
            Write-Host "Fout bij keyserver import: $($_.Exception.Message)"
            # Fallback naar handmatige import
            #$publicKeyContent = "Public-key block"
            $publicKeyContent | Out-File -FilePath "release_public_key.asc" -Encoding ascii
            gpg --import "release_public_key.asc"
        }

        # Optioneel: Vertrouw de sleutel zodat GPG geen waarschuwingen geeft over onvertrouwde handtekeningen
        # Alleen nodig als de sleutel nog niet in de trusted store van de runner zit
        # gpg --batch --yes --edit-key $publicKeyId trust quit
        Write-Host "GPG configuratie voltooid."
      shell: pwsh

    - name: Verify GPG Signatures # Stap 3: Verifieer de GPG-handtekeningen van alle gedownloade executables
      run: |
        $filesToVerify = @(
            "Password_entropy_verifier.exe",
            "vop.exe",
            "t3.exe"
        )

        foreach ($file in $filesToVerify) {
            $signatureFile = "$file.asc"
            Write-Host "Verifiëren van $file met handtekening $signatureFile..."
            try {
                gpg --verify $signatureFile $file
                if ($LASTEXITCODE -eq 0) {
                    Write-Host "Succesvolle GPG verificatie voor $file."
                } else {
                    throw "GPG verificatie mislukt voor $file. Exit code: $LASTEXITCODE."
                }
            } catch {
                throw "Fout tijdens GPG verificatie voor $file: $($_.Exception.Message)"
            }
        }
      shell: pwsh

    - name: Test Executables # Stap 4: Voer de gedownloade executables uit en test hun functionaliteit
      run: |
        Write-Host "Start functionele tests voor executables..."

        # Test Password_entropy_verifier.exe
        Write-Host "Testen van Password_entropy_verifier.exe..."
        $passOutput = & "Password_entropy_verifier.exe" # Voer zonder argumenten uit
        # Controleer of de output een verwachte string bevat, of dat het gewoon succesvol draait
        if ($LASTEXITCODE -ne 0) {
            throw "Password_entropy_verifier.exe afgesloten met foutcode $LASTEXITCODE. Output: $($passOutput | Out-String)"
        }
        Write-Host "Password_entropy_verifier.exe succesvol uitgevoerd (Exit Code 0)."

        # Test vop.exe
        Write-Host "Testen van vop.exe..."
        $vopOutput = & "vop.exe"
        if ($LASTEXITCODE -ne 0) {
            throw "vop.exe afgesloten met foutcode $LASTEXITCODE. Output: $($vopOutput | Out-String)"
        }
        Write-Host "vop.exe succesvol uitgevoerd (Exit Code 0)."

        # Test t3.exe
        Write-Host "Testen van t3.exe..."
        $t3Output = & "t3.exe"
        if ($LASTEXITCODE -ne 0) {
            throw "t3.exe afgesloten met foutcode $LASTEXITCODE. Output: $($t3Output | Out-String)"
        }
        Write-Host "t3.exe succesvol uitgevoerd (Exit Code 0)."

        # --- Optioneel: Voeg hier meer specifieke tests toe per executable ---
        # Bijvoorbeeld voor Password_entropy_verifier.exe met een testwachtwoord
        # $passwordTestOutput = & "Password_entropy_verifier.exe" "SterkWachtwoord123!" | Out-String
        # if ($passwordTestOutput -notlike "*Sterkte: Sterk*") {
        #    throw "Password_entropy_verifier.exe gaf onverwachte output voor testwachtwoord."
        # }

        Write-Host "Alle executables succesvol geverifieerd en getest!"
      shell: pwsh
